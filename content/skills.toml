# Habilidades de clase. Cada clase tiene 4 habilidades normales (se equipan 2) y 1 definitiva.
# cooldown N: si se usa en el turno t, vuelve a estar disponible en el turno t+N.
# damage_type: "basic" usa el tipo del ataque básico de la clase.
# splash: (solo en mazmorras) fracción del daño que también reciben los demás enemigos.

# ---------------- GUERRERO ----------------
[golpe_aplastante]
name = "Golpe aplastante"
description = "Un mandoble brutal con todo el peso del cuerpo."
class = "guerrero"
cooldown = 3
unlock_level = 1
multiplier = 1.8

[bastion_de_hierro]
name = "Bastión de hierro"
description = "Se planta y encaja los golpes: recibe mucho menos daño durante 2 ataques."
class = "guerrero"
cooldown = 5
unlock_level = 1
guard = 0.5
guard_turns = 2

[quebrantar]
name = "Quebrantar"
description = "Golpea las armas del enemigo: su daño baja un 25 % durante 3 turnos."
class = "guerrero"
cooldown = 4
unlock_level = 6
multiplier = 1.0
weaken = 0.25
weaken_turns = 3

[sed_de_sangre]
name = "Sed de sangre"
description = "Un golpe salvaje que le devuelve parte de la vida."
class = "guerrero"
cooldown = 5
unlock_level = 12
multiplier = 1.4
heal_pct = 0.12

[furia_del_caido]
name = "Furia del caído"
description = "Definitiva. Un golpe devastador que deja aturdido al enemigo."
class = "guerrero"
ultimate = true
cooldown = 8
unlock_level = 8
multiplier = 3.0
stun_turns = 1

