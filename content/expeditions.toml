# Expediciones. 'risk' es solo texto informativo; el riesgo real lo marcan los enemigos de cada reserva.
# item_chance: probabilidad de objeto por enemigo normal; elite_item_chance: por élite.
# loot_quality: >1 favorece rarezas altas.
# encounters_per_hour: encuentros que se acumulan por hora. Pesos: más peso = aparece más.

[cripta]
name = "Cripta Olvidada"
description = "Un laberinto de nichos y huesos bajo una iglesia en ruinas. Los muertos aún se mueven, pero sin demasiada convicción."
risk = "seguro"
min_level = 1
recommended_level = 1
encounters_per_hour = 4
item_chance = 0.06
elite_item_chance = 0.0
loot_quality = 0.8
enemies = [
  { enemy = "cripta_bruto", weight = 20 },
  { enemy = "cripta_ligero", weight = 20 },
  { enemy = "cripta_espectro", weight = 20 },
]

