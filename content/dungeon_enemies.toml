# Enemigos de mazmorra. Sus números son RELATIVOS al grupo que entra:
#  hp_k       = vida, en "rondas de daño de un héroe medio" (daño medido, con habilidades)
#  dmg_frac   = daño por golpe, como fracción de la vida media del grupo
#  armor_frac = armadura, como fracción del poder medio del grupo
# Así el combate dura parecido con 2, 3 o 4 jugadores y a cualquier nivel.

